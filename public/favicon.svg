<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="redGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ef4444" />
      <stop offset="0.5" stop-color="#dc2626" />
      <stop offset="1" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="subtleShadow" x="0" y="2" width="48" height="46" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#dc2626" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Shield -->
  <rect x="4" y="4" width="40" height="40" rx="12" fill="url(#redGrad)" filter="url(#subtleShadow)" />
  
  <!-- Medical Cross with White Glow -->
  <!-- Vertical bar of cross -->
  <rect x="21" y="11" width="6" height="26" rx="3" fill="#ffffff" />
  <!-- Horizontal bar of cross -->
  <rect x="11" y="21" width="26" height="6" rx="3" fill="#ffffff" />

  <!-- Heartbeat / EKG Pulse in Red through the center -->
  <path d="M12 24 H18 L20 18 L24 30 L27 22 L29 24 H36" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Dynamic Queue Signal Dots -->
  <circle cx="34" cy="14" r="2.2" fill="#ffffff" opacity="0.95" />
  <circle cx="38" cy="14" r="1.5" fill="#ffffff" opacity="0.75" />
</svg>
